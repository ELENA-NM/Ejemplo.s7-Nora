<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buzón de sugerencias</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh;
    display: grid; place-items: start center;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #f4f6f8; color: #1a2027;
    padding: 24px;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #121820; color: #e8eef5; }
    .caja { background: #1b232e !important; border-color: #2b3644 !important; }
    .espacio-formulario { background: #16202b !important; border-color: #2b3644 !important; color: #9fb0c2 !important; }
  }
  .caja {
    background: #fff; border: 1px solid #dde3ea; border-radius: 14px;
    padding: 34px; width: 100%; max-width: 480px; text-align: center;
    box-shadow: 0 10px 30px -18px rgba(0,0,0,.3);
    box-sizing: border-box;
  }
  h1 { font-size: 24px; margin: 0 0 12px; }
  p { margin: 0 0 14px; line-height: 1.55; }
  .espacio-formulario {
    margin-top: 22px;
    border: 2px dashed #c7d0da;
    border-radius: 10px;
    padding: 28px 16px;
    color: #6b7684;
    font-size: 14px;
    line-height: 1.5;
  }
</style>
</head>
<body>
  <div class="caja">
    <h1>Buzón de sugerencias</h1>
    <p>Un espacio para que cualquier persona de esta área deje sus sugerencias, comentarios o ideas.</p>
    <div class="espacio-formulario">
      Aquí va a ir el formulario para dejar una sugerencia.
    </div>
  </div>
</body>
</html>
